<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; showStats: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Assets -->
    <a-assets>

      <!-- Target image -->
      <img
        id="card"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png"
      />

      <!-- 3D Model -->
      <a-asset-item
        id="avatarModel"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf">
      </a-asset-item>

    </a-assets>


    <!-- Camera -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- Image Target -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Target image displayed in AR -->
      <a-plane
        src="#card"
        position="0 0 0"
        height="0.552"
        width="1"
        rotation="0 0 0">
      </a-plane>


      <!-- 3D Avatar -->
      <a-gltf-model
        src="#avatarModel"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.005 0.005 0.005"
        animation="
          property: position;
          to: 0 0.1 0.1;
          dur: 1000;
          easing: easeInOutQuad;
          loop: true;
          dir: alternate">
      </a-gltf-model>

    </a-entity>

  </a-scene>

</body>
</html>
